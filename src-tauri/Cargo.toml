[package]
name = "mathstudii"
version = "0.1.0"
description = "Engineering calculation worksheets with live math, units, solving, plotting and symbolics"
authors = ["mathstudii contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mathstudii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
